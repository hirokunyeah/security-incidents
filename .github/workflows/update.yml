name: Update ledger

on:
  schedule:
    - cron: "40 22 * * *"   # 07:40 JST, after the 06:00 Claude check
    - cron: "40 1 * * *"    # 10:40 JST, catch-up run
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-ledger
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Fetch latest data and rebuild
        run: python3 _build/fetch_and_build.py .
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898238+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update ledger $(date -u +%Y-%m-%d)"
          git push
